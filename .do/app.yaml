# DigitalOcean App Platform spec for the Kiotel knowledge-graph MCP server.
# Deploys the Docker image pushed to the team's DO Container Registry (DOCR).
#
#   doctl registry create kiotel --region nyc3        # one-time, if no registry yet
#   doctl registry login
#   docker tag kiotel-graph-mcp registry.digitalocean.com/kiotel/kiotel-graph-mcp:latest
#   docker push registry.digitalocean.com/kiotel/kiotel-graph-mcp:latest
#   doctl apps create --spec .do/app.yaml             # first deploy
#   doctl apps update <app-id> --spec .do/app.yaml    # subsequent deploys
#
# App Platform terminates TLS automatically → https://<app>.ondigitalocean.app/mcp
name: kiotel-graph-mcp
region: nyc
services:
  - name: mcp
    image:
      registry_type: DOCR
      registry: kiotel
      repository: kiotel-graph-mcp
      tag: latest
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs   # graph is in-memory; 512MB is plenty for 7.8k nodes
    health_check:
      port: 8080
      http_path: /mcp
      # /mcp answers 4xx to bare GETs — any HTTP response marks the port healthy enough;
      # if the platform treats 4xx as failure, switch to a TCP check in the console.
    # To require auth for non-claude.ai clients (Claude Code / Cursor send headers):
    # envs:
    #   - key: GRAPHIFY_API_KEY
    #     scope: RUN_TIME
    #     type: SECRET
    #     value: <set-in-console>

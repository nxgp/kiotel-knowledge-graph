# DigitalOcean App Platform spec for the Kiotel knowledge-graph MCP server.
#
# Builds the image straight from the GitHub repo's Dockerfile — no container
# registry, no manual image push. App Platform rebuilds + redeploys on every
# push to `main`, terminates TLS automatically, and gives a stable URL:
#     https://<app-name>-<hash>.ondigitalocean.app
# The MCP endpoint is that URL + /mcp; the dashboard is + /dashboard.
#
# Deploy (either path):
#   A) Console: Create → Apps → GitHub → nxgp/kiotel-knowledge-graph → it
#      detects this spec automatically. Review, Create.
#   B) CLI:  doctl auth init          # one-time, needs a DO API token
#            doctl apps create --spec .do/app.yaml
#            doctl apps update <app-id> --spec .do/app.yaml   # later deploys
name: kiotel-graph-mcp
region: nyc
services:
  - name: mcp
    github:
      repo: nxgp/kiotel-knowledge-graph
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    # The 16k-node graph loads fully into memory (NetworkX). basic-xs (1 GB)
    # has comfortable headroom; basic-xxs (512 MB) may work but is tight —
    # start at xs, drop to xxs later if memory sits low.
    instance_size_slug: basic-xs
    health_check:
      # /healthz returns 200 (unlike /mcp, which 4xx's a bare GET).
      port: 8080
      http_path: /healthz
      initial_delay_seconds: 20   # allow time to load the 18 MB graph.json
      period_seconds: 30
    # OPTIONAL — require a key for Claude Code / Cursor (they send headers).
    # LEAVE OFF if you want the claude.ai custom connector to work, since
    # claude.ai connectors cannot send a static Authorization header.
    # envs:
    #   - key: GRAPHIFY_API_KEY
    #     scope: RUN_TIME
    #     type: SECRET
    #     value: <set-in-console>

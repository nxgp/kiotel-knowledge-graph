services:
  kiotel-graph-mcp:
    build: .
    image: kiotel-graph-mcp:latest
    container_name: kiotel-graph-mcp
    ports:
      - "8080:8080"
    environment:
      # Uncomment to require an API key on the HTTP transport:
      # GRAPHIFY_API_KEY: ${GRAPHIFY_API_KEY}
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

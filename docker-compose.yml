services:
  kiotel-graph-mcp:
    build: .
    image: kiotel-graph-mcp:latest
    container_name: kiotel-graph-mcp
    ports:
      - "8080:8080"
    environment:
      # Uncomment to require an API key on the MCP endpoint (/dashboard stays open):
      # GRAPHIFY_API_KEY: ${GRAPHIFY_API_KEY}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./metrics-data:/data   # persists usage metrics (SQLite) across restarts
    restart: unless-stopped
